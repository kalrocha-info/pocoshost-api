name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pocoshost_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pocoshost_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: pocoshost_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-only-jwt-secret
      NODE_ENV: test
      PORT: 3001
      ASAAS_API_URL: https://api-sandbox.asaas.com/v3
      ASAAS_API_KEY: ci-test-key
      ASAAS_WEBHOOK_TOKEN: ci-webhook-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npm run lint
      - run: npm run test:coverage
